{% extends "base.html" %}
{% block content %}
<h1>All Expenses</h1>

<form method="GET" action="{{ url_for('expenses') }}" class="filter-form">
  <select name="category">
    <option value="">All Categories</option>
    {% for c in categories %}
      <option value="{{ c }}" {% if c == selected_category %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>

  <input type="date" name="start_date" value="{{ start_date }}">
  <input type="date" name="end_date" value="{{ end_date }}">

  <button type="submit">Filter</button>
  <a href="{{ url_for('expenses') }}">Clear</a>
</form>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Category</th>
      <th>Amount</th>
      <th>Note</th>
      <th>Recurring</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for e in expenses %}
      <tr>
        <td>{{ e.date }}</td>
        <td>{{ e.category }}</td>
        <td>{{ e.amount }}</td>
        <td>{{ e.note }}</td>
        <td>{{ "Yes" if e.is_recurring else "No" }}</td>
        <td>
          <form method="POST" action="{{ url_for('delete_expense', expense_id=e.id) }}"
                onsubmit="return confirm('Delete this expense?');">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="6">No expenses found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
